[package]
name = "CactupDocs"
version = "0.1.0"
edition = "2024"
description = "Static documentation-site generator for cactup — introspects the Cactup crate's clap and serde structs and merges hand-authored Markdown."

[[bin]]
name = "cactupdocs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Source introspection of the sibling Cactup crate (clap + serde structs).
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# Content pipeline.
pulldown-cmark = "0.12"
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
walkdir = "2"
# Local preview server (`cactupdocs serve`).
tiny_http = "0.12"
