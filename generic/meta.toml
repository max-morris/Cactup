# generic — the built-in default machine (port of simfactory2 generic.ini).
#
# Used as the zero-match fallback for unrecognized hosts (design §4.3/§4.6) and
# as the base template for `cactup machine create` (§4.7). It describes a
# single-node workstation with NO batch system. Its discover.py returns False:
# `generic` is never auto-matched, only used as the explicit fallback or via
# `--machine generic`.

[machine]
name        = "Generic Machine"
nickname    = "generic"
location    = "somewhere"
description = "Single-node workstation, no batch system"
status      = "personal"
hostname    = "generic.some.where"

[paths]
# Both `simulation-home` and `install-home` are omitted on purpose: generic takes
# the built-in ~/.cactup/simulations and ~/.cactup/cacti fallbacks (design
# §4.6/§4.2/§8.1), correct on both Linux (/home/...) and macOS (/Users/...).

[hardware]
# No fixed core/RAM counts: cactup autodetects max-cpus-per-node/memory from
# the OS at load time (design §4.6).
autodetect = true

[build]
make = "make -j@MAKEJOBS@"

[scheduler]
# No scheduler: background the script, echo its PID as the job id; ps/pkill for
# status/stop. @STDOUT_FILE@/@STDERR_FILE@ default to @RUNDIR@/@SIMULATION_NAME@.{out,err}
# unless -o/-e are given (design §8.5).
submit          = "exec nohup @SCRIPTFILE@ < /dev/null > @STDOUT_FILE@ 2> @STDERR_FILE@ & echo $!"
get-status       = "ps @JOB_ID@"
# Kill the whole process group descending from @JOB_ID@, not just the top process.
stop            = "pkill -g $(ps -o pgid= -p @JOB_ID@)"
submit-pattern   = "(.*)"
status-pattern   = "^ *@JOB_ID@ "
queued-pattern   = "$^"          # never "queued"
running-pattern  = "^"           # in ps => running
holding-pattern  = "$^"          # never "held"
exec-host        = "echo localhost"
exec-host-pattern = "(.*)"
stdout          = "cat @SIMULATION_NAME@.out"
stderr          = "cat @SIMULATION_NAME@.err"
stdout-follow   = "tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err"

[environment]
# Applied to build, submit, AND run (design §4.2/§6.1); phase-specific
# additions would go in env-build-setup / env-submit-setup / env-run-setup.
# The configure scripts strip /usr/local and system dirs from XXX_DIR to avoid
# choosing system libraries; re-add them last so compilers still find them.
env-setup = """
export LIBRARY_PATH="${LIBRARY_PATH+$LIBRARY_PATH:}/usr/local/lib64:/usr/local/lib:/usr/lib64:/usr/lib:/lib64:/lib"
export CPATH="${CPATH+$CPATH:}/usr/local/include:/usr/include:/include"
"""

[queues.local]
gpu          = false
max-walltime = "8760:00:00"
default      = true

# Single variant of each script; being the sole variant it is the implicit
# default, so default = true is optional but stated for clarity (design §4.2).
# A variant may also set tasks = N — the default TASKS when no -n/-T/-t flag is
# given, instead of filling the node (§8.5); testsuite runs already default to
# 2 without it (§11.6).
[variants.submitscript]
"default" = { queues = ["local"], default = true }
"test"    = { queues = ["local"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["local"], default = true }
"test"    = { queues = ["local"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
