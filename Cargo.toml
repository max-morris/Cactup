[package]
name = "Cactup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"] }
gix = { version = "0.85.0", features = ["blocking-http-transport-reqwest", "interrupt"] }
prodash = { 
    version = "31.0.0",
    features = ["progress-tree-log", "render-line", "render-line-crossterm", "render-line-autoconfigure", "signal-hook"]
}
colored = "3.1.1"

[[bin]]
name = "cactup"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
