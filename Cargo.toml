[package]
name = "Cactup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"] }
gix = { version = "0.85.0", features = ["blocking-http-transport-reqwest", "interrupt"] }
prodash = { 
    version = "31.0.0",
    features = ["progress-tree-log", "render-line", "render-line-crossterm", "render-line-autoconfigure", "signal-hook"]
}
colored = "3.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.150"
fs4 = "1.1.0"
signal-hook = "0.4"
toml = { version = "1.1.2", features = ["preserve_order"] }
indexmap = { version = "2.14.0", features = ["serde"] }
include_dir = "0.7.4"
regex = "1.13.0"
gethostname = "1.1.0"
tempfile = "3.27.0"
chrono = { version = "0.4.45", features = ["serde"] }

[[bin]]
name = "cactup"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
