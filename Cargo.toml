[workspace]
# The Cactup package lives at the repo root (kept here so its
# `include_dir!("$CARGO_MANIFEST_DIR/mdb/generic")` and `CARGO_MANIFEST_DIR`
# joins against `mdb/` keep resolving unchanged); it is a workspace member
# automatically. CactupDocs is the sibling documentation-site generator.
members = ["cactupdocs"]
resolver = "2"

[package]
name = "Cactup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"] }
gix = { version = "0.85.0", features = ["blocking-http-transport-reqwest", "interrupt"] }
prodash = { 
    version = "31.0.0",
    features = ["progress-tree-log", "render-line", "render-line-crossterm", "render-line-autoconfigure", "signal-hook", "unit-bytes"]
}
colored = "3.1.1"
# Already in the tree transitively (tempfile, gix-fs); pure Rust, MUSL-safe.
fastrand = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.150"
signal-hook = "0.4"
toml = { version = "1.1.2", features = ["preserve_order"] }
indexmap = { version = "2.14.0", features = ["serde"] }
include_dir = "0.7.4"
regex = "1.13.0"
gethostname = "1.1.0"
tempfile = "3.27.0"
chrono = { version = "0.4.45", features = ["serde"] }
# Pinned to the same 0.29 line prodash already pulls in via crosstermion, and
# ratatui's `crossterm_0_29` feature makes it target that same crossterm —
# `cargo tree -i crossterm` must show a single 0.29.x entry, not two majors.
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }

[dev-dependencies]
gix = { version = "0.85.0", features = ["tree-editor"] }

[[bin]]
name = "cactup"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
