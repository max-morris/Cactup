# MARCONI A3 — the Skylake partition of the PRACE Tier-0 system at CINECA
# (SLURM; Lenovo NeXtScale, Intel OmniPath).
# Ported from simfactory2 mdb/machines/marconiA3.ini.
#
# Deviations from the old ini:
#   - rsynccmd/sshcmd dropped (remote subsystem is gone, D1/D2).
#   - The old ini's `queue = @QUEUE@` was a placeholder (the submitscript
#     hardcodes `--partition skl_usr_prod` after `-p @QUEUE@`, and the later
#     directive wins in SLURM); that partition is declared as the sole queue
#     below.
#   - submit used @SUBMITSCRIPT@ (old name for the generated script) ->
#     @SCRIPTFILE@.
# [machine].name/nickname keep the upstream (sic) "MARCONIA1"/"marconiA1"
# values from the A3 ini.
#
# Upstream hardware notes:
#   Model: Lenovo NeXtScale, Intel OmniPath cluster; 1512 nodes;
#   2 x 24-core Intel Xeon 8160 (Skylake) at 2.10 GHz (48 cores/node);
#   192 GB/node; peak 7 PFlop/s.

# last-tested-on: 2018-01-28
# last-tested-by: Roberto De Pietri <roberto.depietri at unipr.it>

[machine]
name        = "MARCONIA1"
nickname    = "marconiA1"
location    = "CINECA, Casalecchio di Reno (BO), Italy"
description = "A PRACE Tier-0 system"
status      = "production"
hostname    = "login.marconi.cineca.it"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/marconi/home/userexternal/@USER@"
simulation-home = "/marconi/home/userexternal/@USER@/simulations"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/marconi/home/userexternal/@USER@/tests"

[hardware]
max-tasks-per-node             = 48
memory          = 193536        # MB per node

[build]
make      = "make -j@MAKEJOBS@"
make-jobs = 4
disabled-thorns = [
    "ExternalLibraries/PAPI",
    "ExternalLibraries/libjpeg",
    "CactusIO/IOJpeg",
]
# The old ini carried these commented-out entries; kept for reference:
#    ExternalLibraries/LORENE
#    EinsteinInitialData/Meudon_Bin_BH
#    EinsteinInitialData/Meudon_Bin_NS
#    EinsteinInitialData/Meudon_Mag_NS
#    CaCUDA/CaCUDALib
#    CaCUDA/WaveToyCUDA
#    CactusPUGHIO/IOHDF5
#    CactusPUGHIO/IOHDF5Util

[environment]
env-setup = """
module unload env-knl
module unload env-bdw
module load env-skl
module load profile/advanced
module load intel/pe-xe-2017--binary
module load intelmpi/2017--binary
module load mkl/2017--binary
module load gnu/6.1.0
##-----------------------------
module load gsl/2.2.1--intel--pe-xe-2017--binary
module load blas/3.6.0--intel--pe-xe-2017--binary
module load lapack/3.6.1--intel--pe-xe-2017--binary
module load fftw/3.3.4--intelmpi--2017--binary
##-----------------------------
module load szip/2.1--gnu--6.1.0
#no required the other # module load zlib/1.2.11--intel--pe-xe-2017--binary
module load zlib/1.2.8--gnu--6.1.0
module load hdf5/1.8.17--intel--pe-xe-2017--binary
# -------- NOT UPDATE for intel 2018
# module load zlib/1.2.11--intel--pe-xe-2017--binary
# module load gsl/2.2.1--intel--pe-xe-2017--binary
# module load lapack/3.6.1--intel--pe-xe-2017--binary
# module load intel/pe-xe-2018--binary
# module load intelmpi/2018--binary
# module load mkl/2018--binary
# module load gsl/2.2.1--gnu--6.1.0
# module load szip/2.1--gnu--6.1.0
# module load zlib/1.2.8--gnu--6.1.0
# module load lapack/3.6.1--gnu--6.1.0
# module load hdf5/1.8.18--intel--pe-xe-2018--binary
# module load fftw/3.3.7--intelmpi--2018--binary
"""

[scheduler]
submit          = "sbatch @SCRIPTFILE@"
get-status      = "squeue -j @JOB_ID@"
stop            = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job (\d+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
# Carried verbatim from the old ini (PBS-style, likely stale on a SLURM
# machine, but preserved).
exec-host        = "qstat -f @JOB_ID@"
exec-host-pattern = 'exec_host = (\w+)/'
stdout          = "cat @SIMULATION_NAME@.out"
stderr          = "cat @SIMULATION_NAME@.err"
stdout-follow   = "tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err"
# Machine-level fallback ceiling (design §4.2); the single queue relies on it.
max-walltime    = "24:00:00"
# historical default allocation; set the allocation knob instead
allocation      = "NO_ALLOCATION"

# The Skylake production partition (hardcoded in the old submitscript).
[queues.skl_usr_prod]
gpu     = false
default = true

[variants.submitscript]
"default" = { queues = ["skl_usr_prod"], default = true }
"test"    = { queues = ["skl_usr_prod"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["skl_usr_prod"], default = true }
"test"    = { queues = ["skl_usr_prod"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
