# Perlmutter Phase 1 — HPE Cray EX at NERSC (SLURM; A100 GPU nodes, CUDA
# build).
# Ported from simfactory2 mdb/machines/perlmutter-p1.ini.
#
# Deviations from the old ini:
#   - sourcebasedir (/global/u1/@("@USER@"[0])@/@USER@) and basedir
#     (/pscratch/sd/@("@USER@"[0])@/@USER@/simulations) used a string-slicing
#     template (the user's first letter) that meta.toml paths cannot express
#     (only @USER@ is substituted, design §4.2). install-home/simulation-home/
#     test-home are therefore omitted (see [paths]) and must be set per user.

# last-tested-on: 2021-11-18
# last-tested-by: Roland Haas <rhaas at illinois.edu>

[machine]
name        = "Perlmutter Phase 1"
nickname    = "perlmutter-p1"
location    = "NERSC"
description = "Cray EX supercomputer"
webpage     = "https://docs.nersc.gov/systems/perlmutter/"
status      = "experimental"
hostname    = "perlmutter-p1.nersc.gov"

[paths]
# The old paths embedded the user's first letter:
#   sourcebasedir = /global/u1/<u>/@USER@
#   basedir       = /pscratch/sd/<u>/@USER@/simulations
# — not expressible in meta.toml paths. Set install-home/simulation-home
# explicitly in a per-user override; until then the ~/.cactup/{cacti,
# simulations,tests} fallbacks apply.
#install-home    = "/global/u1/<u>/@USER@"
#simulation-home = "/pscratch/sd/<u>/@USER@/simulations"
#test-home       = "/pscratch/sd/<u>/@USER@/tests"

[hardware]
threads-per-cpu         = 1
max-cpus-per-node             = 128
memory          = 262144        # MB per node

[build]
make      = "make -j@MAKEJOBS@"
make-jobs = 16
enabled-thorns = [
    "CarpetX/WaveToyGPU",
    "ExternalLibraries/CUDA",
    "ExternalLibraries/pciutils",
]

[environment]
# cmake >= 3.19 causes issues with ADIOS2 (bad HDF5 version detection in
# system cmake) — upstream comment.
env-setup = """
module unload PrgEnv-nvidia
module unload PrgEnv-intel
module unload PrgEnv-cray
module unload PrgEnv-gnu
module unload gcc
module unload intel
module unload nvc
module unload cudatoolkit
module load PrgEnv-gnu/8.5.0 &&
module load gcc/11.2.0 &&
module load cray-libsci/23.02.1.1 &&
module load cray-mpich/8.1.25 &&
module load cudatoolkit/11.7 &&
module load cray-hdf5-parallel/1.12.2.3 &&
module load cray-fftw/3.3.10.6 &&
module load papi/7.0.1.2 &&
module load cmake/3.22.0
"""

[scheduler]
submit          = "sbatch @SCRIPTFILE@"
# set inside a SLURM allocation; gates `test run` (design §11.6)
allocation-env  = "SLURM_JOB_ID"
get-status      = "squeue -j @JOB_ID@"
stop            = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job (\d+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
exec-host        = "hostname"
exec-host-pattern = '(.*)'
stdout          = "cat @SIMULATION_NAME@.out"
stderr          = "cat @SIMULATION_NAME@.err"
stdout-follow   = "tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err"
# Machine-level fallback ceiling (design §4.2); all queues rely on it.
max-walltime    = "06:00:00"
# historical default allocation; set the allocation knob instead
allocation      = "NO_ALLOCATION"

# Upstream noted the available queues: regular, interactive, debug, preempt
# (only the default was modeled). GPU nodes: the submitscript requests
# --gpus-per-task 1, and the build is CUDA.
[queues.regular]
gpu     = true
default = true

[variants.submitscript]
"default" = { queues = ["regular"], default = true }
"test"    = { queues = ["regular"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["regular"], default = true }
"test"    = { queues = ["regular"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
