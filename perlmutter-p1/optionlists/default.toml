# Perlmutter Phase 1 optionlist (variant "default"), ported from simfactory2
# mdb/optionlists/perlmutter-p1.cfg.

[cactup]
gpu               = true
compatible-queues = ["regular"]

[options]
# Whenever this version string changes, the application is configured
# and rebuilt from scratch
VERSION = "perlmutter-2021-11-19"

CPP = "cpp"
FPP = "cpp"
CC = "cc"
CXX = "CC"
F90 = "ftn"
CUCC = "nvcc"

CPPFLAGS = "-g -DSIMD_CPU"
FPPFLAGS = "-g -traditional"
CFLAGS = "-g -std=gnu99"
CXXFLAGS = "-g -std=c++17"
F90FLAGS = "-g  -fcray-pointer -ffixed-line-length-none"
CUCCFLAGS = "--compiler-bindir CC -x cu -g -std=c++17 -D_GNU_SOURCE --expt-relaxed-constexpr --extended-lambda --forward-unknown-to-host-compiler --Werror cross-execution-space-call --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir"

LD = "nvcc --compiler-bindir CC -g -std=c++17 -D_GNU_SOURCE --expt-relaxed-constexpr --extended-lambda --forward-unknown-to-host-compiler --Werror cross-execution-space-call --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir"
LIBS = "cudart curand nvToolsExt udev"

C_LINE_DIRECTIVES = "yes"
F_LINE_DIRECTIVES = "yes"

DISABLE_INT16 = "yes"
DISABLE_REAL16 = "yes"

VECTORISE = "yes"
VECTORISE_ALIGNED_ARRAYS = "no"
VECTORISE_INLINE = "no"

DEBUG = "no"
CPP_DEBUG_FLAGS = "-DCARPET_DEBUG"
FPP_DEBUG_FLAGS = "-DCARPET_DEBUG"
C_DEBUG_FLAGS = ""
CXX_DEBUG_FLAGS = ""
F90_DEBUG_FLAGS = ""

# Intel icc 14.0.2.144 ices on CTGBase with -Ofast
OPTIMISE = "yes"
CPP_OPTIMISE_FLAGS = "# -DCARPET_OPTIMISE -DNDEBUG"
FPP_OPTIMISE_FLAGS = "# -DCARPET_OPTIMISE -DNDEBUG"
C_OPTIMISE_FLAGS = "-O3"
CXX_OPTIMISE_FLAGS = "-O3"
F90_OPTIMISE_FLAGS = "-O3"
CUCC_OPTIMISE_FLAGS = "-O3"

C_NO_OPTIMISE_FLAGS = "-O0"
CXX_NO_OPTIMISE_FLAGS = "-O0"
F90_NO_OPTIMISE_FLAGS = "-O0"

PROFILE = "no"
CPP_PROFILE_FLAGS = ""
FPP_PROFILE_FLAGS = ""
C_PROFILE_FLAGS = "-pg"
CXX_PROFILE_FLAGS = "-pg"
F90_PROFILE_FLAGS = "-pg"
CUCC_PROFILE_FLAGS = "-pg"

OPENMP = "yes"
CPP_OPENMP_FLAGS = "-fopenmp"
FPP_OPENMP_FLAGS = "-fopenmp"
C_OPENMP_FLAGS = "-fopenmp"
CXX_OPENMP_FLAGS = "-fopenmp"
F90_OPENMP_FLAGS = "-fopenmp"
CUCC_OPENMP_FLAGS = "-fopenmp"

WARN = "yes"
CPP_WARN_FLAGS = ""
FPP_WARN_FLAGS = "-Wall"
C_WARN_FLAGS = "-Wall"
CXX_WARN_FLAGS = "-Wall"
F90_WARN_FLAGS = "-Wall"
CUCC_WARN_FLAGS = "-Wall"

AMREX_ENABLE_CUDA = "yes"

BLAS_DIR = "NO_BUILD"

BOOST_DIR = "BUILD"

CUDA_DIR = "${CUDA_HOME}"
CUDA_LIB_DIRS = "${CUDA_HOME}/lib64"
CUDA_INC_DIRS = "${CUDA_HOME}/include"
CUDA_LIBS = "cudart nvToolsExt"

FFTW3_DIR = "NO_BUILD"

# need GSL2 so cannot build, cannot load GSL modules since it brings in GCC 10 from easybuild
GSL_DIR = "/global/common/software/nersc/easybuild/perlmutter/21.10/software/GSL/2.6-GCC-10.2.0"

HDF5_DIR = "/opt/cray/pe/hdf5-parallel/1.12.2.3/gnu/9.1"

HWLOC_DIR = "BUILD"

LAPACK_DIR = "NO_BUILD"

LIBJPEG_DIR = "BUILD"

MPI_DIR = "NONE"

NSIMD_ARCH = "CPU"
NSIMD_SIMD = "CPU"

OPENBLAS_DIR = "NO_BUILD"
OPENBLAS_LIBS = ""

PAPI_DIR = "${CRAY_PAPI_PREFIX}"

PETSC_DIR = "NO_BUILD"

PTHREADS_DIR = "NO_BUILD"

ZLIB_DIR = "NO_BUILD"
