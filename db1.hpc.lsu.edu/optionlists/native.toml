# db1.hpc.lsu.edu optionlist (variant "native"), ported from simfactory2
# mdb/optionlists/db-new.cfg — the native (non-Singularity) Deep Bayou build:
# gcc/g++ for C/C++, ifort for Fortran, nvcc for CUDA and the link, against a
# frozen set of prebuilt externals under
# /ddnA/project/sbrandt/Cactus/configs/ext (generated by mkopt.py).
#
# The [options] table is rendered back to the native Cactus "NAME = value"
# optionlist before `make <config>-config` (design §7.8); every value is kept
# as a TOML string so the render is faithful to the original. The upstream
# .cfg's leading comment blocks (duplicated mkopt.py provenance banners) are
# not carried; the surviving VERSION line is the last one in the file.

[cactup]
gpu               = true
compatible-queues = ["gpu"]
# Names no universe, so it falls back to the declared [universes.host] (§4.8
# "implicit host universe": loads the host gcc/cuda/mpich modules, via
# env-build-setup, around make). The run must NOT be coerced into it — the
# native runscript loads those modules itself. Routing to the "default"
# run/submit scripts comes from this config's build universe ("host"),
# matched against the `universes` list on the meta.toml script variants
# (§4.8 Feature 1), not from a dedicated queue.
coerce-run-universe = false

[options]
VERSION = "db-new-2026-07-07-externals-2026-06-23-cucc-openmp-cpp8-externals-2026-06-25"

CPP = "cpp"
FPP = "cpp"
# gcc/g++ for C/C++: icpc cannot build AMReX 25.x; icc-built Silo fails to
# link silock with g++ (Intel SVML/irc symbols; icrt.link uses -Qy with g++)
CC  = "gcc"
CXX = "g++"
F90 = "ifort"
CUCC = "nvcc"
LD  = "nvcc --compiler-bindir g++ -g -fno-lto --forward-unknown-to-host-compiler --relocatable-device-code=true"

CPPFLAGS = "-DMPICH_IGNORE_CXX_SEEK"
FPPFLAGS = "-traditional"

# gcc-safe CFLAGS: yaml-cpp's CMake passes CFLAGS to g++ as well
CFLAGS   = "-g -U__STRICT_ANSI__"
CXXFLAGS = "-std=c++17 -g -march=native"
F90FLAGS = "-g -align -pad -xHOST -diag-disable 10397"

# do not export symbols from hwloc so that it is not used by libmpich
LIBDIRS = "${MKLROOT}/../compilers_and_libraries/linux/lib/intel64"
LDFLAGS = "-Wl,--exclude-libs,libhwloc.a"
# ifort + g++ link: Fortran/math/OpenMP runtime
LIBS    = "cudart ifcoremt imf svml intlc iomp5 pthread curand"

C_LINE_DIRECTIVES = "yes"
F_LINE_DIRECTIVES = "yes"

VECTORISE                = "yes"
VECTORISE_ALIGNED_ARRAYS = "no"
VECTORISE_INLINE         = "no"

DISABLE_INT16 = "yes"

DEBUG = "no"
CPP_DEBUG_FLAGS = "-DCARPET_DEBUG"
FPP_DEBUG_FLAGS = "-DCARPET_DEBUG"
C_DEBUG_FLAGS   = ""
CXX_DEBUG_FLAGS = ""
F90_DEBUG_FLAGS = "-check bounds -check format"

OPTIMISE = "yes"
CPP_OPTIMISE_FLAGS = ""
FPP_OPTIMISE_FLAGS = ""
C_OPTIMISE_FLAGS   = "-O2"
CXX_OPTIMISE_FLAGS = "-O2"
F90_OPTIMISE_FLAGS = "-O2"

C_NO_OPTIMISE_FLAGS   = "-O0"
CXX_NO_OPTIMISE_FLAGS = "-O0"
F90_NO_OPTIMISE_FLAGS = "-O0"

PROFILE = "no"
CPP_PROFILE_FLAGS = ""
FPP_PROFILE_FLAGS = ""
C_PROFILE_FLAGS   = "-pg"
CXX_PROFILE_FLAGS = "-pg"
F90_PROFILE_FLAGS = "-pg"

OPENMP           = "yes"
CPP_OPENMP_FLAGS = ""
FPP_OPENMP_FLAGS = "-D_OPENMP"
C_OPENMP_FLAGS   = "-fopenmp"
CXX_OPENMP_FLAGS = "-fopenmp"
CUCC_OPENMP_FLAGS = "-Xcompiler -fopenmp"
F90_OPENMP_FLAGS = "-qopenmp"

WARN           = "yes"
CPP_WARN_FLAGS = ""
FPP_WARN_FLAGS = ""
C_WARN_FLAGS   = "-Wall"
CXX_WARN_FLAGS = "-Wall"
F90_WARN_FLAGS = "-Wall"

# CUDA, configured with the flesh
CUCCFLAGS           = "-std=c++17 -x cu --extended-lambda --expt-relaxed-constexpr -DSIMD_DISABLE -m 64 -arch sm_70 -Xcompiler -march=native -g -Drestrict=__restrict__"
CUCC_DEBUG_FLAGS    = "-DCARPET_DEBUG -O0"
CUCC_OPTIMISE_FLAGS = "-O3 -use_fast_math"
CUCC_WARN_FLAGS     = "-Xcompiler -Wall"
CUCC_DEPEND = "g++ -M -std=c++17 -DMPICH_IGNORE_CXX_SEEK -fopenmp"

# -mkl is an Intel compiler flag; with gcc/g++ LD use explicit MKL libs
BLAS_LIB_DIRS = "${MKLROOT}/lib/intel64"

OPENBLAS_DIR      = "NO_BUILD"
OPENBLAS_LIB_DIRS = "${MKLROOT}/lib/intel64"
OPENBLAS_LIBS     = "mkl_intel_lp64 mkl_gnu_thread mkl_core"

# --- frozen external libraries (from mkopt.py) ---
AMREX_CMAKE_CUDA_ARCHITECTURES = "70"

YAML_CPP_ENABLE_FORTRAN = "OFF"

ADIOS2_DIR = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/ADIOS2"
ADIOS2_ENABLE_FORTRAN = "no"
ADIOS2_ENABLE_SST = "yes"
ADIOS2_INC_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/ADIOS2/lib /ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/ADIOS2/include /ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/ADIOS2/lib"
ADIOS2_LIBS = "adios2_cxx11_mpi adios2_c_mpi adios2_core_mpi adios2_cxx11 adios2_c adios2_core adios2_evpath adios2_atl adios2_enet adios2_ffs adios2_dill"
ADIOS2_LIB_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/ADIOS2/lib"
AMREX_DIR = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/AMReX"
AMREX_ENABLE_CUDA = "yes"
AMREX_ENABLE_FORTRAN = "OFF"
AMREX_INC_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/AMReX/lib /ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/AMReX/include /ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/AMReX/lib"
AMREX_LIBS = "amrex"
AMREX_LIB_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/AMReX/lib"
BLAS_DIR = "NO_BUILD"
BLAS_LIBS = "mkl_intel_lp64 mkl_gnu_thread mkl_core"
FFTW3_DIR = "NO_BUILD"
FFTW3_INC_DIRS = "/usr/local/compilers/Intel/parallel_studio_xe_2020.4/mkl/include/fftw/"
FFTW3_LIBS = "mkl_intel_lp64 mkl_gnu_thread mkl_core"
FFTW3_LIB_DIRS = "/usr/local/compilers/Intel/parallel_studio_xe_2020.4/mkl/lib/intel64"
GSL_DIR = "/usr"
GSL_LIBS = "gsl  gsl gslcblas m"
HDF5_DIR = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/HDF5"
HDF5_ENABLE_CXX = "yes"
HDF5_ENABLE_FORTRAN = "yes"
HDF5_INC_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/HDF5/lib /ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/HDF5/include /ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/HDF5/lib"
HDF5_LIBS = "hdf5_hl_cpp hdf5_cpp hdf5hl_fortran hdf5_fortran hdf5_hl hdf5 m z"
HDF5_LIB_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/HDF5/lib"
HWLOC_DIR = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/hwloc"
HWLOC_INC_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/hwloc/include"
HWLOC_LIBS = "hwloc"
HWLOC_LIB_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/hwloc/lib"
LAPACK_DIR = "NO_BUILD"
LAPACK_LIBS = "mkl_intel_lp64 mkl_gnu_thread mkl_core"
LAPACK_LIB_DIRS = "/usr/local/compilers/Intel/parallel_studio_xe_2020.4/mkl/lib/intel64"
LIBJPEG_DIR = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/libjpeg"
