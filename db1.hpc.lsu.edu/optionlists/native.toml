LIBJPEG_LIBS = "jpeg"
LIBJPEG_LIB_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/libjpeg/lib"
LORENE_DIR = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/LORENE"
LORENE_INC_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/LORENE/Export/C++/Include /ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/LORENE/C++/Include"
LORENE_LIBS = "lorene_export lorene lorenef77"
LORENE_LIB_DIRS = "/ddnA/project/sbrandt/Cactus/configs/ext/scratch/external/LORENE/Lib"
MPI_DIR = "/usr/local/packages/mpich/3.3.2/ld3rxvze"
MPI_INC_DIRS = "/usr/local/packages/mpich/3.3.2/ld3rxvze/include"
MPI_LIBS = "mpicxx mpi"
MPI_LIB_DIRS = "/usr/local/packages/mpich/3.3.2/ld3rxvze/lib"
