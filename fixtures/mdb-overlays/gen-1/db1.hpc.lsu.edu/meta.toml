[machine]
name = "db1.hpc.lsu.edu"
nickname = "fixture"
location = "LSU"
description = "LSU Deep Bayou cluster (Slurm)"
status = "personal"
hostname = "fixture.example.org"

[paths]
install-home = "/scratch/fixture-home/cacti"
simulation-home = "/scratch/fixture-home/simulations"
test-home = "/work/@USER@/tests"

[hardware]
max-cpus-per-node = 16
default-cpus-per-task = 24
memory = 65536

[build]
make = "make -j@MAKEJOBS@"
make-jobs = 8

[universes.host]
env-build-setup = """
. "${MODULESHOME:-/usr/local/packages/Modules/4.5.0}/init/bash"
module purge
module load gcc/9.3.0
module load cuda/12.4.0 mpich/3.3.2/intel-19.1.3
"""

[universes.et-sing]
wrapper-argv = [
    "srun",
    "-u",
    "-A",
    "@ALLOCATION@",
    "-p",
    "gpu",
    "-n",
    "1",
    "--cpus-per-task",
    "24",
    "singularity",
    "exec",
    "--nv",
    "--bind",
    "/var/spool",
    "--bind",
    "/ddnA",
    "--bind",
    "/project",
    "--bind",
    "/etc/ssh/ssh_known_hosts",
    "--bind",
    "/work",
    "--bind",
    "/scratch",
    "/work/sbrandt/images/etworkshop2.simg",
]

[universes.et-sing-cpu]
wrapper-argv = [
    "srun",
    "-u",
    "-A",
    "@ALLOCATION@",
    "-p",
    "gpu",
    "-n",
    "1",
    "--cpus-per-task",
    "24",
    "singularity",
    "exec",
    "--bind",
    "/var/spool",
    "--bind",
    "/ddnA",
    "--bind",
    "/project",
    "--bind",
    "/etc/ssh/ssh_known_hosts",
    "--bind",
    "/work",
    "--bind",
    "/scratch",
    "/work/sbrandt/images/etworkshop2.simg",
]

[scheduler]
submit = "sbatch @SCRIPTFILE@ 2>&1"
blocking-submit = "sbatch --wait @SCRIPTFILE@ 2>&1"
get-status = "squeue -j @JOB_ID@"
get-status-many = "squeue -h -u @USER@ -o '%i %t (%r)'"
stop = "scancel @JOB_ID@"
submit-pattern = 'Submitted batch job (\d+)'
status-pattern = "@JOB_ID@ "
queued-pattern = " PD "
running-pattern = " (CF|CG|R|TO) "
holding-pattern = '\(JobHeldUser\)'
exec-host = "hostname -s"
exec-host-pattern = '(\S+)'
max-walltime = "72:00:00"
allocation-env = "SLURM_JOB_ID"

[queues.gpu]
gpu = true

[variants.submitscript.default]
queues = ["gpu"]
build-universes = ["host"]

[variants.submitscript.sing]
queues = ["gpu"]
build-universes = [
    "et-sing",
    "et-sing-cpu",
]

[variants.submitscript.test]
queues = ["gpu"]
build-universes = ["host"]
test = true

[variants.submitscript.sing-test]
queues = ["gpu"]
build-universes = [
    "et-sing",
    "et-sing-cpu",
]
test = true

[variants.runscript.default]
queues = ["gpu"]
build-universes = ["host"]

[variants.runscript.sing]
queues = ["gpu"]
build-universes = [
    "et-sing",
    "et-sing-cpu",
]

[variants.runscript.test]
queues = ["gpu"]
build-universes = ["host"]
test = true

[variants.runscript.sing-test]
queues = ["gpu"]
build-universes = [
    "et-sing",
    "et-sing-cpu",
]
test = true

[variants.optionlist]
variants = [
    "native",
    "sing-nv",
    "sing-cpu",
]

[cactup]
mdb-generation = 1

[cactup.origin]
from = "db1.hpc.lsu.edu"
hash = "a0ceca9a9614c1a3"
