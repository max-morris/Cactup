OPENPMD_DIR         = "/ddnB/project/sbrandt/externals-qbd/install/openpmd"
OPENPMD_INSTALL_DIR = "/ddnB/project/sbrandt/externals-qbd/install/openpmd"
OPENPMD_INC_DIRS    = "/ddnB/project/sbrandt/externals-qbd/install/openpmd/lib /ddnB/project/sbrandt/externals-qbd/install/openpmd/include"
OPENPMD_LIB_DIRS    = "/ddnB/project/sbrandt/externals-qbd/install/openpmd/lib"
OPENPMD_LIBS        = "openPMD"

AMREX_DIR                      = "/ddnB/project/sbrandt/externals-qbd/install/amrex"
AMREX_INSTALL_DIR              = "/ddnB/project/sbrandt/externals-qbd/install/amrex"
AMREX_INC_DIRS                 = "/ddnB/project/sbrandt/externals-qbd/install/amrex/include /ddnB/project/sbrandt/externals-qbd/install/amrex/lib"
AMREX_LIB_DIRS                 = "/ddnB/project/sbrandt/externals-qbd/install/amrex/lib"
AMREX_LIBS                     = "amrex"
