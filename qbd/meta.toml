# qbd — LSU/LONI Queen Bee 4 cluster (qbd504.loni.org; SLURM).
# Ported from simfactory2 mdb/machines/qbd.ini (upstream regenerated it with
# simfactory-configure.py on 2026-07-07).
#
# NOTE: that upstream regeneration flipped the scheduler SLURM->PBS
# (qsub/qstat/qdel). We do not follow that flip — qbd runs SLURM
# (sbatch/squeue/scancel), matching its sibling LONI machine qbc.loni.org.
# One other upstream change we do keep: the Singularity-image build is gone —
# this is now a native CUDA build against the prebuilt externals under
# /ddnB/project/sbrandt/externals-qbd. One we do NOT keep: that regeneration
# also dropped the srun-wrapped `make` (builds farmed out to the queue). qbd
# requires building on the compute nodes, so that behavior is restored — but as
# a first-class queued build ([variants.buildsubmitscript] below, §7.9), not by
# wrapping `make` in a universe. A universe says WHERE a command runs; the
# scheduler says HOW work reaches a machine. Conflating them is what made the
# old wrapper reimplement job-id parsing, status polling and log streaming in
# sh; cactup does all three itself now.
#
# The upstream `queue` field was blank after the regeneration (an earlier
# port carried that as a placeholder queue with an empty scheduler-facing
# name). The queues below are QB4's real GPU partitions — gpu2 (default) and
# gpu4 — the same ones the old ini's scripts branched on.

[machine]
name        = "QueenBee4"
nickname    = "qbd"
location    = "LONI"
description = "Auto-configured"
status      = "production"
hostname    = "qbd.loni.org"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/work/@USER@"
simulation-home = "/work/@USER@/simulations"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/work/@USER@/tests"

[hardware]
max-cpus-per-node = 64
# Request default when `-c` is omitted (design §8.5). The shape both partitions
# aim for is ONE RANK PER GPU with the node's cores split evenly between them —
# which, since cactup gives each rank one GPU by default, is what makes a
# no-flag job fill the node it was given. That means this key has to track the
# partition's GPU count: 64/2 = 32 here for gpu2, overridden to 64/4 = 16 on
# gpu4 below. 32 also lands gpu2 exactly on its 32-CPUs-per-GPU cap (the same
# shape as db1's 2 × 24 on 48-core/2-GPU nodes).
default-cpus-per-task = 32
# No `default-gpus-per-task` here: one GPU per rank is cactup's global default
# (§8.5) and is exactly what QB4 wants, on both partitions. Setting it would be
# a no-op key for a future editor to trip over.
memory             = 514913    # MB per node

[build]
make      = "make -j@MAKEJOBS@"
make-jobs = 64
# qbd makes you build on the compute nodes, so an unqualified `cactup build`
# goes to the queue (§7.9). This is also what the auto-choice would pick — the
# buildsubmitscript below plus [scheduler].submit make submitting possible —
# but it is stated rather than inferred, because building on a QB4 login node
# is a policy violation, not merely slow.
default-action = "submit"

# The build job's shape. One node, one task: `make -j` is shared-memory, so
# extra nodes buy nothing. cpus-per-task tracks make-jobs (a full node's 64
# cores) — the old wrapper's `--cpus-per-task @MAKEJOBS@`. Compiling needs no
# GPU, but see the --gres note in buildsubmitscripts/default.py: QB4 counts
# only GPUs asked for via --gres against its CPUs-per-GPU cap, so a full-node
# build must reserve the node's whole GPU complement to be allowed its cores.
queue         = "gpu2"
walltime      = "4:00:00"
nodes         = 1
tasks         = 1
cpus-per-task = 64

[environment]
# Compilers. The system gcc (8.5) has no _Float16, so CCTK_REAL2 was being
# configured away; gcc 13.2.0 exists only as a module. But nvcc 12.2 supports
# host gcc only up to 12, and with a gcc-13 host it also trips over glibc's
# floatn.h (the typedefs for _Float32 & co. are withheld from a compiler that
# claims __GNUC__ >= 13, which nvcc's front end does without knowing the
# types). ExternalLibraries/AMReX's detect.sh compiles every C++ file with
# nvcc, and under nvcc the flesh maps CCTK_REAL2 to __half, so the C++ side
# never needs _Float16 at all. Hence the split:
#   - gcc/11.4.0 (module): nvcc's host compiler (--compiler-bindir g++) and
#     gfortran, both within nvcc 12.2's supported range;
#   - gcc 13.2.0 (absolute path, optionlists/default.toml): CC for the flesh's
#     C code, and CXX for the configure-time _Float16 probe only;
#   - gcc 13's lib64 first on LD_LIBRARY_PATH and in LIBDIRS: the C objects
#     need libgcc >= 12 for the half<->double helpers (__extendhfdf2), and
#     libstdc++ 13 is a superset of 11 for everything nvcc/g++ 11 produced.
env-setup = """
  module purge &&
  module load cuda/12.2.1 gcc/11.4.0
  export PATH="/ddnB/project/sbrandt/externals-qbd/install/mpi/bin:$PATH"
  export LD_LIBRARY_PATH="/usr/local/packages/compilers/gcc/13.2.0/lib64:/ddnB/project/sbrandt/externals-qbd/install/mpi/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
"""

[scheduler]
# Grab stderr so we can see submit problems in the log.
submit           = "sbatch @SCRIPTFILE@ 2>&1"
blocking-submit  = "sbatch --wait @SCRIPTFILE@ 2>&1"
# set inside a SLURM allocation; gates `test run` (design §11.6)
allocation-env  = "SLURM_JOB_ID"
get-status       = "squeue -j @JOB_ID@"
# One-call form `sim list` uses so it needn't ask job by job; `%i %t (%r)`
# is what keeps the patterns below matching.
get-status-many = "squeue -h -u @USER@ -o '%i %t (%r)'"
stop             = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job (\d+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
exec-host        = "hostname -s"
exec-host-pattern = '(\S+)'
# Machine-level fallback ceiling (design §4.2); the single queue relies on it.
max-walltime     = "24:00:00"

# QB4's GPU partitions (the old ini's scripts branched on exactly these two).
# gpu2: 2 GPUs/node; gpu4: 4 GPUs/node. QB4 enforces db1-style gres rules —
# CPUs per GPU are capped (32 on gpu2) and only GPUs requested via `--gres`
# count — so the submitscripts emit `--gres=gpu:{4,2}` per queue and the
# build universe above requests `--gres=gpu:2`.
#
# The 2-vs-4 split is a per-queue `max-gpus-per-node` override (§4.2) rather
# than a machine-level [hardware] key, because the two partitions genuinely
# differ; everything else (64 CPUs, 32 CPUs/task, memory) is shared and stays
# inherited. These are ceilings, not targets: at cactup's default of one GPU
# per rank they are what a layout is checked against (§8.5), so a request
# needing more GPUs per node than the partition has — e.g. `-c 16` on gpu2,
# which puts 4 ranks over 2 GPUs — is refused before anything is submitted
# rather than queued forever.
# Both GPU partitions accept 72 h jobs (`scontrol show partition gpu2`,
# 2026-09-15: MaxTime=3-00:00:00), so a long simulation chains in 72 h
# segments rather than the machine-level 24 h fallback above. The parfile
# still has to leave before the segment ends (Cactus::max_runtime) and point
# every restart at one shared checkpoint directory.
[queues.gpu2]
gpu     = true    # native CUDA build (nvcc, AMREX_ENABLE_CUDA = yes)
default = true
max-gpus-per-node = 2
max-walltime = "3-00:00:00"

[queues.gpu4]
gpu = true
max-gpus-per-node = 4
max-walltime = "3-00:00:00"
# 64/4: four ranks, one per GPU, 16 cores each. Inheriting [hardware]'s 32
# would give 2 ranks — half a node's worth of work on a node whose whole
# 4-GPU complement the --gres branch below reserves regardless.
default-cpus-per-task = 16

# CPU partitions (sinfo, 2026-09-02): the 480 CPU nodes qbd[001-480] (64 cores,
# 256 GB) are reachable through three overlapping partitions — `single` (7-day
# limit; site policy: one node per job, enforced in submitscripts/cpu.py),
# `workq` and `checkpt` (3-day limit, multi-node; checkpt is the higher-priority
# but preemptable one, which a checkpointing Cactus run tolerates) — plus
# `bigmem` (5 nodes, 2 TB). They serve the CPU-only optionlist variant `cpu`
# (Carpet/McLachlan/IllinoisGRMHD-style builds, no nvcc). 8 threads per rank
# gives 8 ranks per node, one per 8-core slice, which is the usual sweet spot
# for Carpet; override with -c.
[queues.single]
gpu = false
max-walltime = "7-00:00:00"
default-cpus-per-task = 8

[queues.workq]
gpu = false
max-walltime = "3-00:00:00"
default-cpus-per-task = 8

[queues.checkpt]
gpu = false
max-walltime = "3-00:00:00"
default-cpus-per-task = 8

[queues.bigmem]
gpu = false
max-walltime = "3-00:00:00"
default-cpus-per-task = 8

[variants.submitscript]
"default" = { queues = ["gpu2", "gpu4"], default = true }
"cpu"     = { queues = ["single", "workq", "checkpt", "bigmem"] }
"test"    = { queues = ["gpu2", "gpu4"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["gpu2", "gpu4"], default = true }
"cpu"     = { queues = ["single", "workq", "checkpt", "bigmem"] }
"test"    = { queues = ["gpu2", "gpu4"], test = true }   # used by `cactup test run`

# Both GPU partitions can build; the script derives --gres per queue. CPU-only
# configs build on `single` (`cactup build submit <cfg> -q single`), which
# needs no --gres at all.
[variants.buildsubmitscript]
"default" = { queues = ["gpu2", "gpu4"], default = true }
"cpu"     = { queues = ["single", "workq", "checkpt", "bigmem"] }

[variants.optionlist]
variants = ["default", "cpu"]
