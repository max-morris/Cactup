# qbd — LSU/LONI Queen Bee 4 cluster (qbd504.loni.org; SLURM).
# Ported from simfactory2 mdb/machines/qbd.ini (upstream regenerated it with
# simfactory-configure.py on 2026-07-07).
#
# NOTE: that upstream regeneration flipped the scheduler SLURM->PBS
# (qsub/qstat/qdel). We do not follow that flip — qbd runs SLURM
# (sbatch/squeue/scancel), matching its sibling LONI machine qbc.loni.org.
# One other upstream change we do keep: the Singularity-image build is gone —
# this is now a native CUDA build against the prebuilt externals under
# /ddnB/project/sbrandt/externals-qbd. One we do NOT keep: that regeneration
# also dropped the srun-wrapped `make` (builds farmed out to the queue). qbd
# requires building on the compute nodes, so that behavior is restored as the
# [universes.compute] build universe below (§4.8).
#
# The upstream `queue` field was blank after the regeneration (an earlier
# port carried that as a placeholder queue with an empty scheduler-facing
# name). The queues below are QB4's real GPU partitions — gpu2 (default) and
# gpu4 — the same ones the old ini's scripts branched on.

[machine]
name        = "QueenBee4"
nickname    = "qbd"
location    = "LONI"
description = "Auto-configured"
status      = "production"
hostname    = "qbd.loni.org"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/work/@USER@"
simulation-home = "/work/@USER@/simulations"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/work/@USER@/tests"

[hardware]
max-cpus-per-node = 64
# Request default when `-c` is omitted (design §8.5): 2 tasks × 32 CPUs fills
# a 64-core node and matches gpu2's 2 GPUs at exactly the 32-CPUs-per-GPU cap
# (the same shape as db1's 2 × 24 on 48-core/2-GPU nodes).
default-cpus-per-task = 32
memory             = 514913    # MB per node

[build]
make      = "make -j@MAKEJOBS@"
make-jobs = 64
# qbd makes you build on the compute nodes: the build is farmed out to the
# queue via the universe below, like the old ini's srun-wrapped `make`.
universe  = "compute"

# Build universe (§4.8). The old ini wrapped `make` in
#   srun -p gpu2 --gpus-per-task 1 --gres=gpu:… -N @NODES@ -n @NUM_PROCS@
#        --cpus-per-task $((MAKEJOBS > NUM_THREADS ? …)) -A @ALLOCATION@
#        singularity exec --nv … make -j@MAKEJOBS@
# The upstream regeneration dropped that along with the Singularity image, but
# qbd still requires builds to run on a compute node, so the queue-farmed
# build is restored here (minus the image — the build is native now).
#
# NOT an srun prefix, though: QB4's srun client aggregates task output when
# its stdout is not a tty (a full build's output arrived as one slug at srun
# exit), so builds looked hung for their whole duration. Instead the wrapper
# submits via `sbatch --wait` with the job writing to a file, and streams that
# file with `tail -f` — the same mechanism used to follow sim output, which
# streams fine on these clusters. sbatch also prints "Submitted batch job N"
# immediately, so a build waiting in the queue is visibly queued, and it shows
# up in squeue as build-<config>. The final lines can lag the NFS attribute
# cache; the raw sbatch log stays at ~/.cactup-build-<config>.log.
#
# Request shape, from the old wrapper collapsed to build time: one task,
# cpus-per-task tracks @MAKEJOBS@ (the effective `make -j`, default 64 = a
# full node). gpu2 caps CPUs per GPU at 32, so the full-node build must
# request both of the node's GPUs even though compiling needs none — via
# `--gres` (the old wrapper's form): the cap does not count GPUs asked for
# with `--gpus-per-task`.
#   - `-p gpu2` matches the old make wrapper and the default queue below.
#   - `-A @ALLOCATION@` binds from the allocation knob (`cactup knob
#     allocation <acct>`), required on LONI just like the submitscript's
#     unconditional `#SBATCH -A`.
# @COMMAND@ is the shell-quoted `env-setup + make` snippet; the wrapper's
# shell unquotes it as sbatch's --wrap argument, so the snippet (including
# the module loads) becomes the batch script and runs on the compute node.
# The RUN is not coerced into this universe (the submitscript sbatch'es its
# own job); the optionlist sets coerce-run-universe = false accordingly.
# Exit status: we do NOT trust sbatch's own rc. On qbd2 the site fronts sbatch
# with a lua shim (its banners: `sbatch: lua: Submitted job N`, SU estimates)
# that returns 0 even when submission fails OR the wrapped job dies — a build
# whose inner `make` failed would otherwise be reported as a success, and
# cactup's completeness check would then misdiagnose it. So the wrapper derives
# its own status: submission must yield a `Submitted batch job <id>` (no id ⇒
# submission failed), and after `--wait` returns we ask the scheduler for the
# job's real outcome (sacct, or scontrol as a fallback) rather than believing
# the shim. Only State==COMPLETED with ExitCode 0:0 exits 0.
[universes.compute]
wrapper = """
out="$HOME/.cactup-build-@CONFIGURATION@.log"
subout="$HOME/.cactup-build-@CONFIGURATION@.submit.log"
: > "$out"
tail -f "$out" &
tailpid=$!
# --wait blocks until the job ends; sbatch's stdout (the "Submitted batch job N"
# line and any shim banners) is teed so it stays visible live and parseable
# after. The pipeline's exit status is tee's, not sbatch's — deliberately, see
# the note above.
sbatch --wait -A @ALLOCATION@ -p gpu2 --gres=gpu:2 -N 1 -n 1 --cpus-per-task @MAKEJOBS@ -J build-@CONFIGURATION@ -o "$out" -e "$out" --wrap @COMMAND@ 2>&1 | tee "$subout"
sleep 5
kill "$tailpid" 2>/dev/null || true
echo "cactup: full sbatch log: $out"
jobid=$(sed -n 's/.*Submitted batch job \\([0-9][0-9]*\\).*/\\1/p' "$subout" | head -n1)
if [ -z "$jobid" ]; then
  echo "cactup: sbatch reported no job id — submission failed (see above)" 1>&2
  exit 1
fi
info=$(sacct -j "$jobid" --format=State,ExitCode -n -P 2>/dev/null | head -n1)
if [ -z "$info" ]; then
  info=$(scontrol show job "$jobid" 2>/dev/null | tr ' ' '\\n' \\
         | awk -F= '/^JobState=/{s=$2} /^ExitCode=/{e=$2} END{if(s!="")print s"|"e}')
fi
echo "cactup: job $jobid outcome: ${info:-unknown}" 1>&2
case "$info" in
  COMPLETED'|'0:0*) exit 0 ;;
  *) echo "cactup: build job did not complete cleanly (see $out)" 1>&2; exit 1 ;;
esac
"""

[environment]
# Verbatim from the upstream heredoc (including its leading indentation and the
# trailing `&&` on the module-purge line).
env-setup = """
  module purge &&
  module load cuda/12.2.1
  export PATH="/ddnB/project/sbrandt/externals-qbd/install/mpi/bin:$PATH"
  export LD_LIBRARY_PATH="/ddnB/project/sbrandt/externals-qbd/install/mpi/lib:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
"""

[scheduler]
# Grab stderr so we can see submit problems in the log.
submit           = "sbatch @SCRIPTFILE@ 2>&1"
# set inside a SLURM allocation; gates `test run` (design §11.6)
allocation-env  = "SLURM_JOB_ID"
get-status       = "squeue -j @JOB_ID@"
# One-call form `sim list` uses so it needn't ask job by job; `%i %t (%r)`
# is what keeps the patterns below matching.
get-status-many = "squeue -h -u @USER@ -o '%i %t (%r)'"
stop             = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job (\d+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
exec-host        = "hostname -s"
exec-host-pattern = '(\S+)'
# Machine-level fallback ceiling (design §4.2); the single queue relies on it.
max-walltime     = "24:00:00"

# QB4's GPU partitions (the old ini's scripts branched on exactly these two).
# gpu2: 2 GPUs/node; gpu4: 4 GPUs/node. QB4 enforces db1-style gres rules —
# CPUs per GPU are capped (32 on gpu2) and only GPUs requested via `--gres`
# count — so the submitscripts emit `--gres=gpu:{4,2}` per queue and the
# build universe above requests `--gres=gpu:2`.
[queues.gpu2]
gpu     = true    # native CUDA build (nvcc, AMREX_ENABLE_CUDA = yes)
default = true

[queues.gpu4]
gpu = true

[variants.submitscript]
"default" = { queues = ["gpu2", "gpu4"], default = true }
"test"    = { queues = ["gpu2", "gpu4"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["gpu2", "gpu4"], default = true }
"test"    = { queues = ["gpu2", "gpu4"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
