# rostam flavor "x86-cuda-native": the x86 CUDA partitions built on the host,
# without the cactus-cuda image. Rostam's own modules supply MPI and HDF5 (see
# [universes.x86-modules] in meta.toml), CUDA is the system's 12.8, and the
# compilers are AlmaLinux 9's gcc 11.5, the compiler those modules were built
# with (so HDF5's Fortran modules match gfortran). Builds run on the login
# node, like the image flavor's.
#
# The compile flags are x86-cuda-image.toml's (see the comments there for
# why each flag is needed), so that comparing the two flavors measures the
# build environment rather than the flags. What differs:
#   - the toolchain: gcc 11.5 and CUDA 12.8 here, the image's own otherwise;
#   - MPI: OpenMPI 5.0.7 here (launched with srun --mpi=pmix), MPICH there;
#   - AMReX is built by Cactus here, for the same sm_70 and sm_80, where the
#     image has it prebuilt;
#   - every ExternalLibrary the host lacks (GSL, FFTW3, Boost, yaml-cpp,
#     pciutils, Silo, PETSc, ADIOS2, openPMD) is built by Cactus.

[cactup]
universe    = "x86-modules"
description = "native host build (gcc 11.5, CUDA 12.8, OpenMPI 5) for the x86 CUDA partitions"

[cactup.runs-on]
queues = ["cuda-A100", "cuda-A100-amd", "cuda-A100-intel"]
gpu    = true

[options]
# cactup requires VERSION (emitted first; a change forces a full rebuild).
VERSION = "x86-cuda-native-2026-10-12"

CPP = "cpp"
CC  = "gcc"
CXX = "g++"
F90 = "gfortran"
F77 = "gfortran"
# The device link of the relocatable device code goes through nvcc.
LD  = "nvcc --forward-unknown-to-host-compiler -ccbin=g++"

CXXFLAGS = "-O2 -g -std=c++17"
CFLAGS   = "-O2 -g"
F90FLAGS = "-O2 -g -fallow-argument-mismatch -fallow-invalid-boz -ffixed-line-length-none -fcray-pointer"
F77FLAGS = "-O2 -g -fallow-argument-mismatch -fallow-invalid-boz -ffixed-line-length-none -fcray-pointer"

LDFLAGS = "-rdynamic"
LIBS    = "curand gfortran"
# Cactus turns LIBDIRS into -L and -Wl,-rpath, so the executable finds CUDA's
# and the modules' libraries without LD_LIBRARY_PATH. HDF5 was built with
# szip, so the HDF5 thorn links -lsz, and nothing else says where it is.
LIBDIRS = "/usr/local/cuda-12.8/lib64 /opt/apps/openmpi/5.0.7/lib /opt/apps/hdf5/1.14.6/lib /opt/apps/szip/2.1.1/lib"
PTHREADS_DIR = "NO_BUILD"

ac_cv_prog_cc_c23 = "no"
LD_OPENMP_FLAGS   = "-fopenmp"
OPENMP = "yes"

DEBUG   = "no"
PROFILE = "no"

CUCC      = "nvcc"
CUCCFLAGS = "-x cu -ccbin=g++ -std=c++17 -O2 -g -gencode=arch=compute_70,code=sm_70 -gencode=arch=compute_80,code=sm_80 -Wno-deprecated-gpu-targets -diag-suppress=20012 -Xcompiler -fopenmp --expt-relaxed-constexpr --extended-lambda --relocatable-device-code=true"

CPPFLAGS       = "-DSIMD_DISABLE"
DISABLE_INT16  = "yes"
DISABLE_REAL16 = "yes"

AMREX_DIR                      = "BUILD"
AMREX_ENABLE_CUDA              = "yes"
AMREX_CMAKE_CUDA_ARCHITECTURES = "70;80"

MPI_DIR      = "/opt/apps/openmpi/5.0.7"
MPI_INC_DIRS = "/opt/apps/openmpi/5.0.7/include"
MPI_LIB_DIRS = "/opt/apps/openmpi/5.0.7/lib"
MPI_LIBS     = "mpi_mpifh mpi"

# Parallel HDF5 with Fortran, built against openmpi/5.0.7 (hdf5/1.14.6).
HDF5_DIR            = "/opt/apps/hdf5/1.14.6"
HDF5_INC_DIRS       = "/opt/apps/hdf5/1.14.6/include"
HDF5_LIB_DIRS       = "/opt/apps/hdf5/1.14.6/lib"
HDF5_LIBS           = "hdf5hl_fortran hdf5_fortran hdf5_hl hdf5"
HDF5_ENABLE_FORTRAN = "yes"
HDF5_ENABLE_CXX     = "no"

# The zlib and hwloc that the HDF5 and OpenMPI modules load.
ZLIB_DIR  = "/opt/apps/zlib/1.3.1"
HWLOC_DIR = "/opt/apps/hwloc/2.12.0"

LIBJPEG_DIR = "/usr"
OPENSSL_DIR = "/usr"
PAPI_DIR    = "/usr"

BLAS_DIR    = "/usr/lib64"
BLAS_LIBS   = "blas"
LAPACK_DIR  = "/usr/lib64"
LAPACK_LIBS = "lapack"

# CUDA ships the OpenCL headers and ICD loader.
OPENCL_DIR      = "/usr/local/cuda-12.8"
OPENCL_INC_DIRS = "/usr/local/cuda-12.8/include"
OPENCL_LIB_DIRS = "/usr/local/cuda-12.8/lib64"
OPENCL_LIBS     = "OpenCL"

GSL_DIR      = "BUILD"
FFTW3_DIR    = "BUILD"
BOOST_DIR    = "BUILD"
YAML_CPP_DIR = "BUILD"
PCIUTILS_DIR = "BUILD"
SILO_DIR     = "BUILD"
PETSC_DIR    = "BUILD"
ADIOS2_DIR   = "BUILD"
OPENPMD_DIR  = "BUILD"
