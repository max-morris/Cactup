# SLURM for the tutorial container: one node, the container itself, with a
# fixed 4 CPUs whatever the host has (SlurmdParameters=config_overrides), so
# the MDB entry, the scheduler and the container's cpuset all agree.
#
# No cgroups (see cgroup.conf): the container is unprivileged, and its own
# cpuset and memory limit already confine every job.
ClusterName=tutorial
SlurmctldHost=cactup-tutorial
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
SlurmdParameters=config_overrides
# Refuse a job that asks for more than a partition allows (a 5-minute job on
# `short`), as clusters do, instead of leaving it pending forever.
EnforcePartLimits=ALL
# GPUs, when the host passes any through: the entrypoint lists them in the node
# line and in gres.conf. Without one, a job asking for a GPU is refused.
GresTypes=gpu
ReturnToService=2
# squeue and friends wait this long for slurmctld before giving up. The
# default, 10 s, is short on a machine shared by a room of containers: an
# squeue that gives up prints nothing, which the notebooks' wait loops
# (`while squeue -h -n NAME | grep -q .`) take for "the job is gone".
MessageTimeout=60
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
# Written by the entrypoint: the node line, with RealMemory from the
# container's memory limit and any GPUs.
include /etc/slurm/node.conf
PartitionName=debug Nodes=cactup-tutorial Default=YES MaxTime=00:30:00 State=UP
PartitionName=short Nodes=cactup-tutorial MaxTime=00:03:00 State=UP
PartitionName=batch Nodes=cactup-tutorial MaxTime=04:00:00 State=UP
PartitionName=gpu Nodes=cactup-tutorial MaxTime=04:00:00 State=UP
