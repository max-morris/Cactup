# Thorny Flat — WVU HPC cluster (PBS/Torque, openmpi).
# Ported from simfactory2 mdb/machines/thornyflat.ini.

# last-tested-on: untested
# last-tested-by: Anuj Kankani

[machine]
name        = "Thorny Flat"
nickname    = "thornyflat"
location    = "WVU"
description = "HPC cluster"
webpage     = "https://docs.hpc.wvu.edu/text/83.ThornyFlat.html"
status      = "production"
hostname    = "tf.hpc.wvu.edu"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/users/@USER@/scratch"
simulation-home = "/users/@USER@/scratch/simulations"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/users/@USER@/scratch/tests"

[hardware]
max-cpus-per-node             = 40
memory          = 98304         # MB per node

[build]
make      = "make -j @MAKEJOBS@"
make-jobs = 12
enabled-thorns  = ["ExternalLibraries/OpenBLAS"]
disabled-thorns = [
    "ExternalLibraries/BLAS",
    "ExternalLibraries/LAPACK",
    "ExternalLibraries/OpenSSL",
    "ExternalLibraries/PAPI",
]

[environment]
env-setup = """
module load lang/gcc/9.3.0
module load parallel/openmpi/3.1.6_gcc93
module load libs/fftw/3.3.9_gcc93
module load libs/hdf5/1.12.2_gcc93
module load libs/openblas/0.3.20_gcc93
"""

[scheduler]
submit          = "qsub @SCRIPTFILE@"
# set inside a PBS allocation; gates `test run` (design §11.6)
allocation-env  = "PBS_JOBID"
get-status      = "qstat @JOB_ID@"
stop            = "qdel @JOB_ID@"
submit-pattern   = '^(\d+)\.'
status-pattern   = '^@JOB_ID@[. ]'
queued-pattern   = ' Q '
running-pattern  = ' R '
holding-pattern  = ' H '
exec-host        = "qstat -f @JOB_ID@"
exec-host-pattern = 'exec_host = (\w+)/'
# Machine-level fallback ceiling (design §4.2). Upstream alternative: 24:00:00.
max-walltime    = "168:00:00"
# historical default allocation ("don't want this entry" — upstream); set the
# allocation knob instead
# allocation      = "NOALLOCATION"

# Upstream comment: or comm_small_day, etc.
[queues.comm_small_week]
gpu     = false
default = true

[variants.submitscript]
"default" = { queues = ["comm_small_week"], default = true }
"test"    = { queues = ["comm_small_week"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["comm_small_week"], default = true }
"test"    = { queues = ["comm_small_week"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
