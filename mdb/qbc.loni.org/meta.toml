# qbc.loni.org — LSU's Queen Bee 3 (QBC) cluster; CPU CarpetX build inside a
# Singularity image on the compute nodes.
# Ported from simfactory2 mdb/machines/qbc.loni.org.ini.
#
# The upstream definition shared mike's submitscript/runscript and
# db-sing-cpu's optionlist (the new format has no cross-machine file sharing,
# so this machine carries its own copies).
#
# ONE Cactup machine for the whole cluster (see design/_mdb_porting_guide.md
# "One machine per cluster"). Upstream also ships a separate "etworkshop-qbc"
# machine — same cluster, byte-identical optionlist and run/submit scripts,
# differing only in that its build runs plain `make` from *inside* the workshop
# container instead of wrapping make in the et-sing universe. That is just this
# machine built with `--no-universe` (build from inside the container), so no
# separate variant is needed; etworkshop-qbc is not ported.

[machine]
name        = "qbc.loni.org"
nickname    = "qbc"
location    = "LSU"
description = "LSU's Queen Bee 3 Cluster"
status      = "production"
hostname    = "qbc.loni.org"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/project/sbrandt/carpetx/@USER@"
simulation-home = "/work/@USER@/simulations"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/work/@USER@/tests"

[hardware]
max-tasks-per-node             = 48
memory          = 196608        # MB per node

[build]
# The old ini's `make` wrapped the actual make in
#   srun … singularity exec … etworkshop2.simg make -j@MAKEJOBS@
# — the §4.8 universe pattern; the wrapper moved to [universes.et-sing] below.
make     = "make -j@MAKEJOBS@"
universe = "et-sing"
# The old ini carried this commented-out line; kept for reference:
#disabled-thorns = EinsteinInitialData/Meudon_Bin_BH EinsteinInitialData/Meudon_Bin_NS EinsteinInitialData/Meudon_Mag_NS ExternalLibraries/LORENE

# Build universe (§4.8), verbatim from the old ini's `make` wrapper. Upstream
# comments:
# (1) LSU machines only have singularity on the compute nodes, so srun is needed here.
# (2) Can't specify -A @ALLOCATION@ here, so we're counting on
#     there being a default allocation for this to work
# (3) QBC requires we ask for 48 cores per node
# Prefix form: cactup appends `/bin/sh -c "<env-setup>\n<make …>"`, so
# env-setup runs inside the image. The RUN stays un-wrapped (the runscript does
# its own `srun … singularity exec` launch — §4.8's MPI boundary); the
# optionlist sets coerce-run-universe = false accordingly.
[universes.et-sing]
kind = "singularity"
wrapper-argv = [
    "srun", "-u", "-A", "@ALLOCATION@", "-p", "checkpt",
    "-n", "1", "--cpus-per-task", "48",
    "singularity", "exec",
    "--bind", "/ddnA", "--bind", "/ddnB", "--bind", "/var/spool",
    "--bind", "/project", "--bind", "/etc/ssh/ssh_known_hosts", "--bind", "/work",
    "/work/sbrandt/images/etworkshop2.simg",
]

[environment]
env-setup = """
module purge
"""

[scheduler]
# Grab stderr so we can see submit problems in the log.
submit          = "sbatch @SCRIPTFILE@ 2>&1"
get-status      = "squeue -j @JOB_ID@"
# need to kill the whole set of processes descending from @JOB_ID@, not just
# the top-level process
stop            = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job (\d+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
exec-host        = "hostname -s"
exec-host-pattern = '(\S+)'
stdout          = "cat @SIMULATION_NAME@.out"
stderr          = "cat @SIMULATION_NAME@.err"
stdout-follow   = "tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err"
# Machine-level fallback ceiling (design §4.2); the single queue relies on it.
max-walltime    = "72:00:00"

[queues.checkpt]
gpu     = false
default = true

[variants.submitscript]
"default" = { queues = ["checkpt"], default = true }
"test"    = { queues = ["checkpt"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["checkpt"], default = true }
"test"    = { queues = ["checkpt"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
