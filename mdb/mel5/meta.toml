# Melete 05 (mel5) — a single-node CCT workstation.
# Ported from simfactory2 mdb/machines/mel5.ini for cactup development/testing.
# There is no batch scheduler here: "submit" just backgrounds the script and
# echoes its PID; status/stop use ps/kill. It is modeled with a single queue
# ("local") and a single script of each kind.

[machine]
name        = "Melete 05"
nickname    = "mel5"
location    = "CCT"
description = "Melete 05"
status      = "personal"
hostname    = "melete05.cct.lsu.edu"

[paths]
# @USER@ is substituted at use time (install/run context).
# Default install prefix (design §4.2). Installs land under <install-home>/<alias>.
# Omit this key to fall back to ~/.cactup/cacti.
install-home    = "/home/@USER@/cacti"
# The per-machine simulation root (design §4.2/§8.1). Per-alias sim-home is
# <simulation-home>/<alias>. Omit this key to fall back to ~/.cactup/simulations.
simulation-home = "/home/@USER@/simulations"
# The per-machine testsuite-output root (design §4.2/§11.5), kept OUT of
# simulation-home. Per-alias test-home is <test-home>/<alias>. Omit this key to
# fall back to ~/.cactup/tests.
test-home       = "/home/@USER@/tests"

[hardware]
max-cpus-per-node             = 80
memory          = 196608        # MB per node

[build]
make = "make -j@MAKEJOBS@"

[scheduler]
# No real batch system: run the script in the background, echo its PID as the
# "job id", and use ps/kill for status/stop.
submit          = "setsid sh @SCRIPTFILE@ < /dev/null > /dev/null 2> /dev/null & echo $!"
# The pid is printed before the wait, so the job id parses immediately.
blocking-submit = "setsid sh @SCRIPTFILE@ < /dev/null > /dev/null 2> /dev/null & pid=$!; echo $pid; wait $pid"
get-status       = "ps @JOB_ID@"
# The job id is the pid of the backgrounded script, on this host.
job-ids = "pids"
stop            = "kill @JOB_ID@"
submit-pattern   = "(.*)"
status-pattern   = "^ *@JOB_ID@ "
queued-pattern   = "$^"          # matches nothing: this machine never "queues"
running-pattern  = "^"           # matches anything: in ps => running
holding-pattern  = "$^"          # matches nothing: never "held"
exec-host        = "echo localhost"
exec-host-pattern = "(.*)"

[environment]
# Shell setup sourced before build/submit/run commands (module loads, env);
# applied to all three phases (design §4.2/§6.1).
env-setup = """
export MPI_DIR="/home/sbrandt/spack/var/spack/environments/cactus/.spack-env/view"
export PATH="${MPI_DIR}/bin:/usr/local/bin:/usr/bin:/bin"
export LD_LIBRARY_PATH="${MPI_DIR}/lib"
export CC="${MPI_DIR}/bin/mpicc"
export CXX="${MPI_DIR}/bin/mpicxx"
"""

# Single local "queue". gpu=false; this is a CPU workstation.
[queues.local]
gpu          = false
max-walltime = "8760:00:00"     # 1 year (effectively unlimited; no scheduler)
default      = true

# One NORMAL script of each kind, plus one TESTSUITE script marked
# test = true (design §11.2). Every key names a script, and each script serves
# exactly the queues it lists — there is no fallback script. The normal
# scripts must cover every queue (here just "local"); a queue with no test
# script simply cannot run the testsuite.
# A script may also set tasks = N — the default TASKS when no -n/-T/-t flag is
# given, instead of filling the node (§8.5); testsuite runs already default to
# 2 without it (§11.6), which is right for this machine.
[submitscripts]
"default" = { queues = ["local"] }
"test"    = { queues = ["local"], test = true }   # used by `cactup test submit`

[runscripts]
"default" = { queues = ["local"] }
"test"    = { queues = ["local"], test = true }   # used by `cactup test run`

# Two flavors, one per file in optionlists/: the normal "default" (marked
# [cactup].default = true, the implicit pick) and "debug" (DEBUG on). A bare
# `cactup build` uses "default"; `cactup build --flavor debug` builds the
# DEBUG binary — e.g. to run the testsuite against it (design §4.4).
