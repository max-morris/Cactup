# et-cuda — CarpetX CUDA build "running on one node from an image"
# (Singularity; LSU infrastructure, gpu2 SLURM partition).
# Ported from simfactory2 mdb/machines/et-cuda.ini.
#
# An unusual upstream combination, preserved as-is: the scheduler block is
# SLURM (sbatch/squeue/scancel into partition gpu2), but the submit/run
# scripts are the generic workstation ones (no #SBATCH directives; sbatch
# accepts a directive-less script). The optionlist was db-sing-nv.cfg (the new
# format has no cross-machine file sharing, so this machine carries its own
# copy).

[machine]
name        = "et-cuda"
nickname    = "et-cuda"
location    = "Singularity"
description = "Running on one node from an image"
status      = "production"
hostname    = "et-cuda"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/project/sbrandt/carpetx/@USER@"
simulation-home = "/work/@USER@/simulations"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/work/@USER@/tests"

[hardware]
max-cpus-per-node             = 64
memory          = 196608        # MB per node

[build]
make = "make -j@MAKEJOBS@"
# The old ini carried this commented-out line; kept for reference:
#disabled-thorns = EinsteinInitialData/Meudon_Bin_BH EinsteinInitialData/Meudon_Bin_NS EinsteinInitialData/Meudon_Mag_NS ExternalLibraries/LORENE

[environment]
env-setup = """
module purge
export PATH="/project/sbrandt/install-dir/bin:$PATH"
export SINGULARITY_NO_OVERLAY=1
export SINGULARITY_TMPDIR=/tmp
export SINGULARITY_BIND=/ddnB,/var/spool,/project,/etc/ssh/ssh_known_hosts,/work
export NVCC_CCBIN=/usr/bin/g++
export NVCC_APPEND_FLAGS="-arch=sm_80"

export SPACK_ROOT="/usr/cactus/spack-root"
export SPACK_VIEW="${SPACK_ROOT}/var/spack/environments/gpu/.spack-env/view"
export PATH="${SPACK_VIEW}/bin:${PATH}"
"""

[scheduler]
# Grab stderr so we can see submit problems in the log.
submit          = "sbatch @SCRIPTFILE@ 2>&1"
blocking-submit = "sbatch --wait @SCRIPTFILE@ 2>&1"
# set inside a SLURM allocation; gates `test run` (design §11.6)
allocation-env  = "SLURM_JOB_ID"
get-status      = "squeue -j @JOB_ID@"
# One-call form `sim list` uses so it needn't ask job by job; `%i %t (%r)`
# is what keeps the patterns below matching.
get-status-many = "squeue -h -u @USER@ -o '%i %t (%r)'"
# need to kill the whole set of processes descending from @JOB_ID@, not just
# the top-level process
stop            = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job (\d+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
exec-host        = "hostname -s"
exec-host-pattern = '(\S+)'
# Machine-level fallback ceiling (design §4.2); the single queue relies on it.
max-walltime    = "72:00:00"

# CUDA build on the gpu2 partition.
[queues.gpu2]
gpu     = true
default = true

[variants.submitscript]
"default" = { queues = ["gpu2"], default = true }
"test"    = { queues = ["gpu2"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["gpu2"], default = true }
"test"    = { queues = ["gpu2"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
