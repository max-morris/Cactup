# qbd — LSU/LONI Queen Bee 4 cluster (qbd504.loni.org; SLURM).
# Ported from simfactory2 mdb/machines/qbd.ini (upstream regenerated it with
# simfactory-configure.py on 2026-07-07).
#
# NOTE: that upstream regeneration flipped the scheduler SLURM->PBS
# (qsub/qstat/qdel). We do not follow that flip — qbd runs SLURM
# (sbatch/squeue/scancel), matching its sibling LONI machine qbc.loni.org.
# One other upstream change we do keep: the Singularity-image build is gone —
# this is now a native CUDA build against the prebuilt externals under
# /ddnB/project/sbrandt/externals-qbd. One we do NOT keep: that regeneration
# also dropped the srun-wrapped `make` (builds farmed out to the queue). qbd
# requires building on the compute nodes, so that behavior is restored as the
# [universes.compute] build universe below (§4.8).
#
# The upstream `queue` field is empty (the auto-configure left it blank), so
# the single queue below is a placeholder with an empty scheduler-facing name:
# @QUEUE@ resolves to "" and the SLURM submitscript omits its `-p` directive.
# Set a real partition before production use — either give this queue a
# `name = "<partition>"` override or edit the submitscript.

[machine]
name        = "QueenBee4"
nickname    = "qbd"
location    = "LONI"
description = "Auto-configured"
status      = "production"
hostname    = "qbd504.loni.org"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/home/@USER@"
simulation-home = "/scratch/@USER@/simulations"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/scratch/@USER@/tests"

[hardware]
max-cpus-per-node = 64
memory             = 514913    # MB per node

[build]
make      = "make -j@MAKEJOBS@"
make-jobs = 64
# qbd makes you build on the compute nodes: the build is farmed out to the
# queue via the universe below, like the old ini's srun-wrapped `make`.
universe  = "compute"

# Build universe (§4.8). The old ini wrapped `make` in
#   srun -p gpu2 --gpus-per-task 1 --gres=gpu:… -N @NODES@ -n @NUM_PROCS@
#        --cpus-per-task $((MAKEJOBS > NUM_THREADS ? …)) -A @ALLOCATION@
#        singularity exec --nv … make -j@MAKEJOBS@
# The upstream regeneration dropped that along with the Singularity image, but
# qbd still requires builds to run on a compute node, so the srun prefix is
# restored here (minus the image — the build is native now). The sim-time
# arithmetic collapses at build time: one task, and cpus-per-task tracks
# @MAKEJOBS@ (the effective `make -j`, default 64 = a full node). gpu2
# enforces a 32-CPUs-per-GPU cap, so the full-node build must request both of
# the node's GPUs (`--gpus-per-task 2`) even though compiling needs none.
#   - `-p gpu2` matches the old make wrapper. The [queues.default] placeholder
#     below has no real partition name yet — keep the two in sync if you set
#     one.
#   - `-A @ALLOCATION@` binds from the allocation knob (`cactup knob
#     allocation <acct>`), required on LONI just like the submitscript's
#     unconditional `#SBATCH -A`.
# Prefix form: cactup appends `/bin/sh -c "<env-setup>\n<make …>"`, so the
# [environment] env-setup (module load cuda …) runs on the compute node.
# The RUN is not coerced into this universe (the submitscript sbatch'es its
# own job); the optionlist sets coerce-run-universe = false accordingly.
[universes.compute]
wrapper-argv = [
    "srun", "-u", "-A", "@ALLOCATION@", "-p", "gpu2",
    "--gpus-per-task", "2",
    "-N", "1", "-n", "1", "--cpus-per-task", "@MAKEJOBS@",
]

[environment]
# Verbatim from the upstream heredoc (including its leading indentation and the
# trailing `&&` on the module-purge line).
env-setup = """
  module purge &&
  module load cuda/12.2.1
  export PATH="/ddnB/project/sbrandt/externals-qbd/install/mpi/bin:$PATH"
  export LD_LIBRARY_PATH="/ddnB/project/sbrandt/externals-qbd/install/mpi/lib:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
"""

[scheduler]
# Grab stderr so we can see submit problems in the log.
submit           = "sbatch @SCRIPTFILE@ 2>&1"
# set inside a SLURM allocation; gates `test run` (design §11.6)
allocation-env  = "SLURM_JOB_ID"
get-status       = "squeue -j @JOB_ID@"
stop             = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job (\d+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
exec-host        = "hostname -s"
exec-host-pattern = '(\S+)'
stdout           = "cat @SIMULATION_NAME@.out"
stderr           = "cat @SIMULATION_NAME@.err"
stdout-follow    = "tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err"
# Machine-level fallback ceiling (design §4.2); the single queue relies on it.
max-walltime     = "24:00:00"

# Placeholder queue (upstream left `queue` blank). `name = ""` makes @QUEUE@
# resolve to the empty string, so the SLURM submitscript emits no `-p` directive
# — override with a real partition (a `name` value here, or edit the script).
[queues.default]
gpu     = true    # native CUDA build (nvcc, AMREX_ENABLE_CUDA = yes)
default = true
name    = ""

[variants.submitscript]
"default" = { queues = ["default"], default = true }
"test"    = { queues = ["default"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["default"], default = true }
"test"    = { queues = ["default"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
