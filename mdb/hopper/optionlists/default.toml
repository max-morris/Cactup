# hopper optionlist (flavor "default"): native CUDA build for CarpetX/AMReX on
# the node's GH200. Written 2026-10-14 as a copy of mdb/athena's, changed for
# the hardware (see meta.toml):
#   - GPU: GH200 -> sm_90 / CMake CUDA architecture 90 (CUCCFLAGS, LD, AMReX).
#   - CPU: Grace (Neoverse-V2) -> -mcpu=neoverse-v2 instead of the x86 flags.
#     aarch64 has _Float16 natively, so there is no -mf16c counterpart.
#   - MPI: the aarch64 HPC-X of the HPC SDK 25.9.
#   - No HWLOC_EXTRA_LIBS: no libudev headers on hopper1.
#   - NSIMD_SIMD = AARCH64 (untested; the benchmark thornlist leaves NSIMD out).

[cactup]
default           = true

[cactup.runs-on]
queues = ["local"]
gpu    = true

[options]
VERSION = "hopper-2026-10-14"

CPP = "cpp"
FPP = "cpp"
CC  = "/opt/rh/gcc-toolset-13/root/usr/bin/gcc"
CXX = "/opt/rh/gcc-toolset-13/root/usr/bin/g++"
F90 = "/opt/rh/gcc-toolset-13/root/usr/bin/gfortran"

FPPFLAGS = "-traditional"
CFLAGS   = "-g -O2 -std=gnu99 -mcpu=neoverse-v2"
CXXFLAGS = "-g -O2 -std=c++17 -D_GNU_SOURCE -mcpu=neoverse-v2"
F90FLAGS = "-g -O2 -fcray-pointer -ffixed-line-length-none -mcpu=neoverse-v2"
LDFLAGS  = "-rdynamic -Wl,--allow-multiple-definition"

LIBS    = "stdc++fs gfortran cudart_static curand_static culibos dl rt pthread"
LIBDIRS = "/packages/cuda/13.3.1/lib64"

C_LINE_DIRECTIVES = "yes"
F_LINE_DIRECTIVES = "yes"

DEBUG           = "no"
CPP_DEBUG_FLAGS = "-DCARPET_DEBUG"
FPP_DEBUG_FLAGS = "-DCARPET_DEBUG"
C_DEBUG_FLAGS   = "-g3"
CXX_DEBUG_FLAGS = "-g3"
F90_DEBUG_FLAGS = "-g3"

OPTIMISE           = "yes"
CPP_OPTIMISE_FLAGS = ""
C_OPTIMISE_FLAGS   = "-O2"
CXX_OPTIMISE_FLAGS = "-O2"
F90_OPTIMISE_FLAGS = "-O2"

PROFILE           = "no"
C_PROFILE_FLAGS   = "-pg"
CXX_PROFILE_FLAGS = "-pg"
F90_PROFILE_FLAGS = "-pg"

WARN           = "yes"
CPP_WARN_FLAGS = "-Wall"
C_WARN_FLAGS   = "-Wall"
CXX_WARN_FLAGS = "-Wall"
F90_WARN_FLAGS = "-Wall"

OPENMP           = "yes"
CPP_OPENMP_FLAGS = "-fopenmp"
FPP_OPENMP_FLAGS = "-D_OPENMP"
C_OPENMP_FLAGS   = "-fopenmp"
CXX_OPENMP_FLAGS = "-fopenmp"
F90_OPENMP_FLAGS = "-fopenmp"
LD_OPENMP_FLAGS  = "-fopenmp"

VECTORISE                = "yes"
VECTORISE_ALIGNED_ARRAYS = "no"
VECTORISE_INLINE         = "yes"

CUCC  = "nvcc"
CUCCFLAGS = "--compiler-bindir g++ -x cu -g -std=c++17 --expt-relaxed-constexpr --extended-lambda --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir --gpu-architecture sm_90 --diag-suppress=20012 -DSIMD_DISABLE"
LD = "nvcc --compiler-bindir g++ -g -fno-lto --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir --gpu-architecture sm_90"
CUCC_DEBUG_FLAGS    = "-g3"
CUCC_OPTIMISE_FLAGS = "-O3"
CUCC_WARN_FLAGS     = "-Xcompiler -Wall"
CUCC_OPENMP_FLAGS   = "-Xcompiler -fopenmp"

DISABLE_INT16  = "yes"
DISABLE_REAL16 = "yes"

AMREX_ENABLE_CUDA = "yes"

PTHREADS_DIR = "NO_BUILD"

CMAKE_DIR = "/packages/cmake/3.31.1"

MPI_DIR      = "/packages/nvhpc/25.9_cuda13.0/Linux_aarch64/25.9/comm_libs/13.0/hpcx/hpcx-2.24/ompi"
MPI_INC_DIRS = "/packages/nvhpc/25.9_cuda13.0/Linux_aarch64/25.9/comm_libs/13.0/hpcx/hpcx-2.24/ompi/include"
MPI_LIB_DIRS = "/packages/nvhpc/25.9_cuda13.0/Linux_aarch64/25.9/comm_libs/13.0/hpcx/hpcx-2.24/ompi/lib"
MPI_LIBS     = "mpi"

HDF5_DIR  = "BUILD"
FFTW3_DIR = "BUILD"
GSL_DIR   = "BUILD"
BOOST_DIR = "BUILD"
HWLOC_DIR = "BUILD"
LIBJPEG_DIR = "BUILD"
BLAS_DIR   = "BUILD"
LAPACK_DIR = "BUILD"
YAML_CPP_DIR = "BUILD"
YAML_CPP_ENABLE_FORTRAN = "OFF"
ADIOS2_DIR  = "BUILD"
OPENPMD_DIR = "BUILD"
SILO_DIR    = "BUILD"

NSIMD_DIR  = "BUILD"
NSIMD_SIMD = "AARCH64"

ZLIB_DIR  = "/usr"
ZLIB_LIBS = "z"
OPENSSL_DIR = "/usr"

AMREX_DIR                      = "BUILD"
AMREX_ENABLE_FORTRAN           = "OFF"
AMREX_ENABLE_HIP               = "no"
AMREX_CMAKE_CUDA_ARCHITECTURES = "90"
