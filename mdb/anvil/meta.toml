# Anvil — ACCESS GNU/Linux cluster at Purdue (SLURM).
# Ported from simfactory2 mdb/machines/anvil.ini.

# last-tested-on: 2023-10-15
# last-tested-by: Gabriele Bozzola <gbozzola at caltech.edu>

[machine]
name        = "anvil"
nickname    = "anvil"
location    = "Purdue"
description = "An ACCESS GNU/Linux cluster at Purdue"
webpage     = "https://www.rcac.purdue.edu/anvil"
status      = "production"
hostname    = "anvil.rcac.purdue.edu"

[paths]
# @USER@ is substituted at use time. Old keys: sourcebasedir / basedir.
install-home    = "/home/@USER@"
simulation-home = "/anvil/scratch/@USER@"
# NEW (design §11.5): testsuite-output root, sibling of simulation-home.
test-home       = "/anvil/scratch/@USER@/tests"

[hardware]
max-cpus-per-node             = 128
memory          = 262144        # MB per node

[build]
make      = "make -j@MAKEJOBS@"
make-jobs = 8
# The old ini's enabled-thorns / disabled-thorns blocks were empty.

[environment]
env-setup = """
module unload gcc || true
module unload intel || true
module load gcc/11.2.0 &&
module load gsl/2.4 &&
module load zlib/1.2.11 &&
module load boost/1.74.0 &&
module load papi/6.0.0.1 &&
module load fftw/3.3.8 &&
module load hdf5/1.10.7 &&
module load openblas/0.3.17 &&
module load python/3.9.5
"""

[scheduler]
submit          = "sbatch @SCRIPTFILE@; sleep 5"
# set inside a SLURM allocation; gates `test run` (design §11.6)
allocation-env  = "SLURM_JOB_ID"
get-status      = "squeue -j @JOB_ID@"
# One-call form `sim list` uses so it needn't ask job by job; `%i %t (%r)`
# is what keeps the patterns below matching.
get-status-many = "squeue -h -u @USER@ -o '%i %t (%r)'"
stop            = "scancel @JOB_ID@"
submit-pattern   = 'Submitted batch job ([0-9]+)'
status-pattern   = '@JOB_ID@ '
queued-pattern   = ' PD '
running-pattern  = ' (CF|CG|R|TO) '
holding-pattern  = '\(JobHeldUser\)'
exec-host        = "hostname"
exec-host-pattern = '^(\S+)'
# Machine-level fallback ceiling (design §4.2). Upstream note: debug has 0:30:0.
max-walltime    = "96:00:00"
# historical default allocation; set the allocation knob instead
# allocation      = "NO_ALLOCATION"

[queues.wholenode]
gpu     = false
default = true

[variants.submitscript]
"default" = { queues = ["wholenode"], default = true }
"test"    = { queues = ["wholenode"], test = true }   # used by `cactup test submit`

[variants.runscript]
"default" = { queues = ["wholenode"], default = true }
"test"    = { queues = ["wholenode"], test = true }   # used by `cactup test run`

[variants.optionlist]
variants = ["default"]
